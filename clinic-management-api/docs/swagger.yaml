basePath: /api/v1
definitions:
  clinic-management-api_internal_database.Appointment:
    properties:
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      doctor:
        $ref: '#/definitions/clinic-management-api_internal_database.Doctor'
      doctorID:
        type: integer
      id:
        type: integer
      notes:
        type: string
      patient:
        $ref: '#/definitions/clinic-management-api_internal_database.Patient'
      patientID:
        type: integer
      scheduleDate:
        type: string
      status:
        description: PENDING, CONFIRMED, IN_PROGRESS, COMPLETED, CANCELLED
        type: string
      updatedAt:
        type: string
    type: object
  clinic-management-api_internal_database.Doctor:
    properties:
      bio:
        type: string
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        type: integer
      name:
        type: string
      phone:
        type: string
      specialization:
        $ref: '#/definitions/clinic-management-api_internal_database.Specialization'
      specializationID:
        type: integer
      updatedAt:
        type: string
      user:
        $ref: '#/definitions/clinic-management-api_internal_database.User'
      userID:
        type: integer
    type: object
  clinic-management-api_internal_database.Patient:
    properties:
      address:
        type: string
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      dob:
        type: string
      gender:
        type: string
      id:
        type: integer
      name:
        type: string
      phone:
        type: string
      updatedAt:
        type: string
      user:
        $ref: '#/definitions/clinic-management-api_internal_database.User'
      userID:
        type: integer
    type: object
  clinic-management-api_internal_database.Specialization:
    properties:
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        type: integer
      name:
        type: string
      updatedAt:
        type: string
    type: object
  clinic-management-api_internal_database.User:
    properties:
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      email:
        type: string
      id:
        type: integer
      password:
        type: string
      role:
        description: ADMIN, DOCTOR, STAFF, PATIENT
        type: string
      updatedAt:
        type: string
    type: object
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  internal_appointment.CreateAppointmentInput:
    properties:
      doctor_id:
        type: integer
      notes:
        type: string
      schedule_date:
        type: string
    required:
    - doctor_id
    - schedule_date
    type: object
  internal_appointment.UpdateStatusInput:
    properties:
      status:
        enum:
        - PENDING
        - CONFIRMED
        - IN_PROGRESS
        - COMPLETED
        - CANCELLED
        type: string
    required:
    - status
    type: object
  internal_auth.LoginInput:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_auth.RegisterInput:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
      role:
        enum:
        - ADMIN
        - DOCTOR
        - STAFF
        - PATIENT
        type: string
    required:
    - email
    - password
    - role
    type: object
host: localhost:8080
